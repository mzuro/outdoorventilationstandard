baseURL = 'https://outdoorventilationstandard.com/'
languageCode = 'en-us'
title = 'Outdoor Ventilation Standard'
theme = 'ovs'
enableGitInfo = false

[frontmatter]
  lastmod = ["lastmod", ":fileModTime"]

[taxonomies]
  tag = "tags"
  category = "categories"

[pagination]
  pagerSize = 20

[params]
  # .Site.Params.description — read by partials/head.html (meta description
  # fallback) and partials/schema.html (Organization JSON-LD).
  description = "Independently researched, physics-grounded analysis of outdoor cooking ventilation. Buoyant plume behavior, entrainment, velocity decay, hood capture performance, and wind interaction."
  # .Site.Params.images — read by partials/head.html (Open Graph / Twitter image fallback).
  images = ["/og-image.png"]

# Search configuration (Fuse.js) — read by _default/search.html (Task 13).
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "url", "summary", "content"]

[[menu.main]]
  name = "Questions"
  url = "/questions/"
  weight = 10

[[menu.main]]
  name = "Instruments"
  url = "/tools/"
  weight = 20

[[menu.main]]
  name = "Research"
  url = "/research/"
  weight = 30

[[menu.main]]
  name = "Standard"
  url = "/governance/"
  weight = 40

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    startLevel = 2

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page = ["HTML"]
