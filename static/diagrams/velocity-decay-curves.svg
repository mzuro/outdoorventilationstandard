  <title id="vdc-title">Centerline velocity decay of the buoyant cooking plume, 18 to 48 inches, for four RB-001 sources</title>
  <desc id="vdc-desc">Line chart of the Heskestad centerline plume velocity u0 = 1.03 Qc^(1/3) (z − z0)^(−1/3) against hood mounting height, 18 to 48 inches (46 to 122 cm), left axis 0 to 3.0 m/s, right axis 100 to 500 fpm. Gas Grill Large (Q_total 17.6 kW, Q_c 12.3 kW, χc 0.70): 490 fpm (2.49 m/s) at 18 in, 465 fpm (2.36 m/s) at 24 in, 444 fpm (2.26 m/s) at 30 in, 427 fpm (2.17 m/s) at 36 in, 411 fpm (2.09 m/s) at 42 in, 398 fpm (2.02 m/s) at 48 in. Gas Grill Medium (Q_total 11.7 kW, Q_c 8.2 kW, χc 0.70): 435 fpm (2.21 m/s) at 18 in, 412 fpm (2.09 m/s) at 24 in, 393 fpm (1.99 m/s) at 30 in, 377 fpm (1.91 m/s) at 36 in, 362 fpm (1.84 m/s) at 42 in, 350 fpm (1.78 m/s) at 48 in. Pellet Smoker High (Q_total 8.8 kW, Q_c 5.7 kW, χc 0.65): 397 fpm (2.02 m/s) at 18 in, 374 fpm (1.90 m/s) at 24 in, 355 fpm (1.80 m/s) at 30 in, 340 fpm (1.73 m/s) at 36 in, 326 fpm (1.66 m/s) at 42 in, 315 fpm (1.60 m/s) at 48 in. Charcoal Kettle (Q_total 4.4 kW, Q_c 1.8 kW, χc 0.40): 253 fpm (1.28 m/s) at 18 in, 240 fpm (1.22 m/s) at 24 in, 230 fpm (1.17 m/s) at 30 in, 222 fpm (1.13 m/s) at 36 in, 214 fpm (1.08 m/s) at 42 in, 207 fpm (1.05 m/s) at 48 in. At 30 inches: Gas Grill Large 444 fpm, Gas Grill Medium 393 fpm, Pellet Smoker High 355 fpm, Charcoal Kettle 230 fpm. Velocity falls slowly with height for every source. Sources RB-003 §3.1 and RB-001 Tables 3.1 and 3.2.</desc>

