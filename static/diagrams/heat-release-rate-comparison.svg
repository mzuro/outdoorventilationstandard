<!-- values from static/js/ovs/physics (RB-001 Table 3.1 Q_total/χ_c/Q_c, Table 3.2 z_0; RB-003 §3.1 u_0 at 30 in); regenerated 2026-09-26 -->
<svg role="img" aria-label="Horizontal bar chart of Q_total and convective Q_c in kilowatts for 8 RB-001 sources, largest first: Gas grill — high-output (80k BTU) 23.4 total, 16.4 convective; Gas grill — large (60k BTU) 17.6 total, 12.3 convective; Gas grill — medium (40k BTU) 11.7 total, 8.2 convective; Wood-fired grill (40k BTU) 11.7 total, 7.6 convective; Pellet smoker — high (30k BTU) 8.8 total, 5.7 convective; Gas grill — small (25k BTU) 7.3 total, 5.1 convective; Charcoal kettle (15k BTU) 4.4 total, 1.8 convective; Pellet smoker — low (8k BTU) 2.3 total, 1.5 convective. Each row also lists the convective fraction and the plume centerline velocity at 30 inches, from 485 fpm for Gas grill — high-output (80k BTU) down to 222 fpm for Pellet smoker — low (8k BTU)." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560">
