<svg role="img" aria-labelledby="spe-title" aria-describedby="spe-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="spe-title">Side-panel effectiveness: 57 inch hood at 30 inches in an 8 mph side wind (Exposed class), without and with two side panels</title>
  <desc id="spe-desc">Two front-view diagrams drawn to one scale (4.5 pixels per inch): a Gas Grill Medium with a 24 inch cooking surface under a 57 inch hood (W_rec) mounted 30 inches above it, side wind 8 mph from the left, which is the RB-008 Exposed class (7 to 12 mph). The hood overhangs the cooking surface by OH = 16.5 inches per side and the OVS capture model uses an aperture of ±OH about the undeflected centerline. Left, without side panels: the plume centerline is deflected 18.8 inches at the hood plane, the ±2σ envelope spills past the downwind aperture edge (Missed Plume Region), capture is 39% (FAIL) and the Exposed class requires K_CFM = 5.75. Right, with two side panels of fractional enclosure f = 0.67 (panel depth 20 inches of the 30 inch mounting height): RB-009 Table 3.1a gives R_panel = 0.60 for lateral wind, so the plume feels 3.2 mph, the centerline deflection is 7.5 inches, capture rises to 87% (PASS), and K_CFM drops to 4.14, a 28% CFM reduction. Capture percentages and grades are the OVS model criterion (≥85% PASS, ≥60% MARGINAL); RB-006 Table 3.10 prints 45 to 55% at 8 mph without panels and has no 8 mph panels-only row (88 to 92% at 5 mph).</desc>
