<!-- values from static/js/ovs/physics (RB-006 §3.1 δ = 0.35·U_w·z/u_0(z), Table 3.2b; RB-006 §3.4 capture thresholds; RB-002 Table 3.7 W_rec; RB-001 Gas Medium); regenerated 2026-09-26 -->
<svg role="img" aria-label="Side-view diagram of the plume centerline bending downwind at 0, 3, 5, 8 and 10 mph. At the 30 inch hood plane the centerline is displaced 7.0, 11.7, 18.8 and 23.5 inches; the 57 inch hood overhangs the 24 inch cooking surface by 16.5 inches per side, so capture falls from 96 percent in still air to 88, 72, 39 and 19 percent." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520">
  <title>Wind-deflected plume trajectories for a Gas Grill Medium under a 57 inch hood at 30 inches</title>
  <defs>
    <style>
      text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <pattern id="captureHatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="#E8F4E8"/>
      <path d="M0,6 L6,0" stroke="#B8D8B8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" fill="#FAFAFA" rx="4"/>

  <!-- Title -->
  <text x="440" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">Wind-Deflected Plume Trajectories at Hood Height</text>
  <text x="440" y="50" text-anchor="middle" font-size="12" fill="#555">Gas Grill Medium (Q_c = 8.2 kW), 57" hood (W_rec) at 30" &#x2014; &#x3B4; = 0.35&#xB7;U_w&#xB7;z / u&#x2080;(z), RB-006 &#xA7;3.1</text>

  <!-- Scene: cooking surface top y=400, hood plane y=200 (30"), scale 6.667 px/in.
       Cooking surface 24" = 160px (x=240..400); hood 57" = 380px (x=130..510), overhang 16.5"/side.
       Deflection at 30": 0 mph 0.0" (Fr 0.00), 3 mph 7.0" (Fr 0.67), 5 mph 11.7" (Fr 1.12), 8 mph 18.8" (Fr 1.79), 10 mph 23.5" (Fr 2.24).
       Capture (RB-006 §3.4 model): 0 mph 96%, 3 mph 88%, 5 mph 72%, 8 mph 39%, 10 mph 19%.
       Critical winds: centreline at hood edge 7.0 mph, 25% escape 4.8 mph. -->

  <!-- Height reference marker -->
  <line x1="760" y1="400" x2="780" y2="400" stroke="#aaa" stroke-width="0.8"/>
  <line x1="760" y1="200" x2="780" y2="200" stroke="#aaa" stroke-width="0.8"/>
  <line x1="770" y1="400" x2="770" y2="200" stroke="#aaa" stroke-width="0.8"/>
  <text x="775" y="305" text-anchor="start" font-size="10" fill="#888" transform="rotate(-90 775 305)">30" mounting height</text>

  <!-- Ground / base platform -->
  <rect x="180" y="420" width="350" height="8" fill="#ddd" rx="2"/>

  <!-- Grill body (24" cooking surface) -->
  <rect x="240" y="400" width="160" height="20" fill="#777" rx="3" stroke="#555" stroke-width="1"/>
  <text x="320" y="415" text-anchor="middle" font-size="9" fill="#fff" font-weight="500">Cooking Surface (24")</text>
  <rect x="260" y="420" width="4" height="8" fill="#888"/>
  <rect x="376" y="420" width="4" height="8" fill="#888"/>

  <!-- Fire/heat indication -->
  <line x1="270" y1="398" x2="275" y2="390" stroke="#DD6600" stroke-width="1.5" opacity="0.5"/>
  <line x1="300" y1="398" x2="305" y2="388" stroke="#DD6600" stroke-width="1.5" opacity="0.5"/>
  <line x1="330" y1="398" x2="332" y2="387" stroke="#DD6600" stroke-width="1.5" opacity="0.5"/>
  <line x1="360" y1="398" x2="358" y2="390" stroke="#DD6600" stroke-width="1.5" opacity="0.5"/>

  <!-- Hood capture zone (under the hood) -->
  <rect x="130" y="190" width="380" height="210" fill="url(#captureHatch)" opacity="0.6"/>
  <text x="132" y="185" font-size="9.5" fill="#5A9A5A" font-weight="500">Hood Capture Zone</text>

  <!-- Hood outline (dashed) -->
  <path d="M120,200 L120,185 Q120,175 130,175 L510,175 Q520,175 520,185 L520,200" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="8,4"/>
  <line x1="120" y1="200" x2="520" y2="200" stroke="#444" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="523" y="190" font-size="10" fill="#444" font-weight="500">Hood (57" wide, 16.5" overhang)</text>
  <line x1="130" y1="200" x2="130" y2="210" stroke="#444" stroke-width="1.5"/>
  <line x1="510" y1="200" x2="510" y2="210" stroke="#444" stroke-width="1.5"/>

  <!-- Wind arrows -->
  <text x="60" y="280" text-anchor="middle" font-size="11" fill="#555" font-weight="600">Wind</text>
  <line x1="30" y1="300" x2="90" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="30" y1="320" x2="90" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="30" y1="340" x2="90" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- PLUME TRAJECTORIES: polylines of deflection(z) for z = 0..40" (extended past the hood plane for legibility) -->
  <polyline points="320.0,400.0 320.0,386.7 320.0,373.3 320.0,360.0 320.0,346.7 320.0,333.3 320.0,320.0 320.0,306.7 320.0,293.3 320.0,280.0 320.0,266.7 320.0,253.3 320.0,240.0 320.0,226.7 320.0,213.3 320.0,200.0 320.0,186.7 320.0,173.3 320.0,160.0 320.0,146.7 320.0,133.3" fill="none" stroke="#333333" stroke-width="2.5" opacity="0.85"/>
  <text x="324.0" y="128" font-size="9" fill="#333" font-weight="500">0 mph</text>
  <polyline points="320.0,400.0 322.3,386.7 324.7,373.3 327.2,360.0 330.0,346.7 332.9,333.3 335.6,320.0 339.0,306.7 342.2,293.3 345.6,280.0 348.9,266.7 352.3,253.3 355.9,240.0 359.6,226.7 363.3,213.3 367.0,200.0 371.0,186.7 374.9,173.3 378.6,160.0 383.0,146.7 387.2,133.3" fill="none" stroke="#4488CC" stroke-width="2.5" opacity="0.85"/>
  <text x="391.2" y="128" font-size="9" fill="#4488CC" font-weight="500">3 mph</text>
  <polyline points="320.0,400.0 323.8,386.7 327.8,373.3 331.9,360.0 336.7,346.7 341.5,333.3 346.0,320.0 351.6,306.7 356.9,293.3 362.7,280.0 368.1,266.7 373.9,253.3 379.9,240.0 385.9,226.7 392.2,213.3 398.3,200.0 405.0,186.7 411.6,173.3 417.7,160.0 425.1,146.7 432.0,133.3" fill="none" stroke="#DDAA00" stroke-width="2.5" opacity="0.85"/>
  <text x="436.0" y="128" font-size="9" fill="#BBAA00" font-weight="500">5 mph</text>
  <polyline points="320.0,400.0 326.0,386.7 332.5,373.3 339.1,360.0 346.7,346.7 354.3,333.3 361.5,320.0 370.5,306.7 379.1,293.3 388.4,280.0 396.9,266.7 406.2,253.3 415.8,240.0 425.5,226.7 435.5,213.3 445.2,200.0 456.0,186.7 466.5,173.3 476.3,160.0 488.1,146.7 499.2,133.3" fill="none" stroke="#DD6600" stroke-width="2.5" opacity="0.85"/>
  <text x="503.2" y="128" font-size="9" fill="#DD6600" font-weight="500">8 mph</text>
  <polyline points="320.0,400.0 327.5,386.7 335.6,373.3 343.8,360.0 353.4,346.7 362.9,333.3 371.9,320.0 383.2,306.7 393.9,293.3 405.5,280.0 416.2,266.7 427.8,253.3 439.8,240.0 451.9,226.7 464.3,213.3 476.5,200.0 490.0,186.7 503.1,173.3 515.4,160.0 530.1,146.7 544.0,133.3" fill="none" stroke="#CC3333" stroke-width="2.5" opacity="0.85"/>
  <text x="548.0" y="128" font-size="9" fill="#CC3333" font-weight="500">10 mph</text>

  <!-- Centreline crossing at the hood plane (deflection values are in the legend) -->
  <circle cx="320.0" cy="200" r="4" fill="#333333" opacity="0.7"/>
  <circle cx="367.0" cy="200" r="4" fill="#4488CC" opacity="0.7"/>
  <circle cx="398.3" cy="200" r="4" fill="#DDAA00" opacity="0.7"/>
  <circle cx="445.2" cy="200" r="4" fill="#DD6600" opacity="0.7"/>
  <circle cx="476.5" cy="200" r="4" fill="#CC3333" opacity="0.7"/>

  <!-- Capture callouts (RB-006 §3.4 Gaussian model, σ = 1.5·b_T) -->
  <line x1="367.0" y1="205" x2="330" y2="252" stroke="#3a7a3a" stroke-width="0.8"/>
  <rect x="230" y="242" width="176" height="20" fill="#FAFAFA" fill-opacity="0.9" rx="3" stroke="#5A9A5A" stroke-width="0.8"/>
  <text x="318" y="256" text-anchor="middle" font-size="9.5" fill="#3a7a3a" font-weight="600">Captured: 96% (0 mph) &#xB7; 88% (3 mph)</text>

  <line x1="398.3" y1="205" x2="455" y2="288" stroke="#AA8800" stroke-width="0.8"/>
  <rect x="420" y="278" width="128" height="20" fill="#FAFAFA" fill-opacity="0.9" rx="3" stroke="#AA8800" stroke-width="0.8"/>
  <text x="484" y="292" text-anchor="middle" font-size="9.5" fill="#AA8800" font-weight="600">Marginal: 72% at 5 mph</text>

  <line x1="476.5" y1="205" x2="590" y2="252" stroke="#CC3333" stroke-width="0.8"/>
  <rect x="560" y="242" width="180" height="20" fill="#FAFAFA" fill-opacity="0.9" rx="3" stroke="#CC3333" stroke-width="0.8"/>
  <text x="650" y="256" text-anchor="middle" font-size="9.5" fill="#CC3333" font-weight="600">Escape: 39% (8 mph) &#xB7; 19% (10 mph)</text>

  <!-- Legend -->
  <line x1="70" y1="465" x2="90" y2="465" stroke="#333333" stroke-width="2.5"/>
  <text x="95" y="469" font-size="10" fill="#333">0 mph (still)</text>
  <line x1="185" y1="465" x2="205" y2="465" stroke="#4488CC" stroke-width="2.5"/>
  <text x="210" y="469" font-size="10" fill="#4488CC">3 mph &#xB7; &#x3B4; 7.0"</text>
  <line x1="305" y1="465" x2="325" y2="465" stroke="#DDAA00" stroke-width="2.5"/>
  <text x="330" y="469" font-size="10" fill="#BBAA00">5 mph &#xB7; &#x3B4; 11.7"</text>
  <line x1="425" y1="465" x2="445" y2="465" stroke="#DD6600" stroke-width="2.5"/>
  <text x="450" y="469" font-size="10" fill="#DD6600">8 mph &#xB7; &#x3B4; 18.8"</text>
  <line x1="545" y1="465" x2="565" y2="465" stroke="#CC3333" stroke-width="2.5"/>
  <text x="570" y="469" font-size="10" fill="#CC3333">10 mph &#xB7; &#x3B4; 23.5"</text>
  <line x1="670" y1="465" x2="700" y2="465" stroke="#444" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="705" y="469" font-size="10" fill="#444">Hood outline</text>
  <text x="440" y="486" text-anchor="middle" font-size="8.5" fill="#777">Centreline reaches the hood edge at 7.0 mph (50% capture); 25% escape at 4.8 mph &#x2014; RB-006 &#xA7;3.4</text>

  <!-- Source attribution -->
  <text x="440" y="506" text-anchor="middle" font-size="10" fill="#999">Source: OVS-RB-006 | outdoorventilationstandard.com</text>
</svg>
