<svg role="img" aria-labelledby="gad-title" aria-describedby="gad-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="gad-title">Grease aerosol transport and deposition downwind of a partially effective hood, by droplet size (RB-011)</title>
  <desc id="gad-desc">Not-to-scale diagram of grease droplets escaping a partially effective hood in a 5 mph wind and depositing downwind in three practical zones from RB-011 §3.3: Zone 1, droplets larger than 50 micrometres, deposit within 1 metre (gravitational settling, ballistic; drip pan, grill exterior, adjacent countertop; about 40% of the escaped mass), settling velocity 0.068 to 0.27 m/s for 50 to 100 micrometres; Zone 2, 20 to 50 micrometres, 1 to 5 metres (gravitational settling; decking, furniture, siding within 5 m; about 30% of the mass), settling 0.011 to 0.068 m/s; Zone 3, 10 to 20 micrometres, 5 to 30 metres (settling plus turbulent diffusion; adjacent structures, vegetation, property boundary; about 15% of the mass), settling 0.0028 to 0.011 m/s. A neighbouring structure is drawn in Zone 3 with a grease film on its windward face. A secondary row gives the RB-011 Table 3.3a centreline-settling formula x_ground = H·U_w/v_s with H = 1.5 m, which ignores turbulent diffusion, impaction and ground effects and so overstates real travel: 50 to 100 micrometres 5–20 m at 2 mph, 12–49 m at 5 mph, 25–99 m at 10 mph; 20 to 50 micrometres 20–123 m, 49–307 m, 99–614 m; 10 to 20 micrometres 0.12–0.49 km, 0.31–1.2 km, 0.61–2.4 km. For 5 micrometre droplets the formula gives 4.8 km at 5 mph; below about 10 micrometres gravitational settling is not the deposition mechanism (RB-011 §3.3). A deposition-intensity bar runs from heavy near the source to trace downwind.</desc>
