<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="plumeGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFA500" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="missedRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DD3333" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#DD3333" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="captureGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44AA44" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#44AA44" stop-opacity="0.05"/>
    </linearGradient>
    <marker id="dimArrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#888"/>
    </marker>
    <marker id="dimArrowRev" markerWidth="6" markerHeight="4" refX="0" refY="2" orient="auto">
      <path d="M6,0 L0,2 L6,4 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#222">Hood Overhang: The Most Critical Geometric Parameter</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#666">Gas Grill Medium (24" cooking surface) at 30" mounting height — plume capture diameter 41" (RB-002 Table 3.9)</text>

  <!-- Divider lines -->
  <line x1="320" y1="60" x2="320" y2="455" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="640" y1="60" x2="640" y2="455" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== LEFT PANEL: No Overhang ===== -->
  <text x="160" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#CC3333">No Overhang (Hood = Cooking Surface)</text>

  <!-- Cooking surface — 24" (scaled: 80px represents 24") -->
  <rect x="120" y="400" width="80" height="10" rx="2" fill="#444" stroke="#333" stroke-width="1"/>
  <text x="160" y="425" text-anchor="middle" font-size="8" fill="#666">Cooking Surface (24")</text>

  <!-- Plume rising — expands to 41" capture diameter at hood height (137px wide) -->
  <path d="M130,400 Q125,370 118,340 Q108,300 98,260 Q91,230 91,210 L229,210 Q229,230 222,260 Q212,300 202,340 Q195,370 190,400 Z" fill="url(#plumeGrad)"/>

  <!-- Hood canopy — same width as cooking surface: 24" = 80px -->
  <path d="M115,170 L120,195 L200,195 L205,170 Z" fill="#555" stroke="#444" stroke-width="2"/>
  <rect x="145" y="140" width="30" height="30" fill="#555" stroke="#444" stroke-width="1.5"/>

  <!-- Missed plume regions — plume (41") is far wider than hood (24") on both sides -->
  <path d="M118,197 Q102,204 91,212 Q88,236 84,262 L104,244 Q113,219 118,197 Z" fill="url(#missedRed)"/>
  <path d="M202,197 Q218,204 229,212 Q232,236 236,262 L216,244 Q207,219 202,197 Z" fill="url(#missedRed)"/>

  <!-- Missed plume labels -->
  <text x="72" y="240" text-anchor="middle" font-size="7" fill="#CC3333" transform="rotate(-90,72,240)">Missed Plume</text>
  <text x="248" y="240" text-anchor="middle" font-size="7" fill="#CC3333" transform="rotate(90,248,240)">Missed Plume</text>

  <!-- Plume width dimension at hood height -->
  <line x1="91" y1="225" x2="229" y2="225" stroke="#AA6600" stroke-width="0.8" stroke-dasharray="3,2" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="160" y="237" text-anchor="middle" font-size="8" fill="#AA6600">41" plume</text>

  <!-- Mounting height dimension -->
  <line x1="55" y1="185" x2="55" y2="400" stroke="#888" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="50" y1="185" x2="60" y2="185" stroke="#888" stroke-width="0.8"/>
  <line x1="50" y1="400" x2="60" y2="400" stroke="#888" stroke-width="0.8"/>
  <text x="52" y="297" text-anchor="middle" font-size="7" fill="#888" transform="rotate(-90,52,297)">30"</text>

  <!-- Hood width dimension -->
  <line x1="120" y1="435" x2="200" y2="435" stroke="#888" stroke-width="0.8" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="160" y="448" text-anchor="middle" font-size="8" fill="#888">24" hood</text>

  <!-- Overhang label -->
  <rect x="110" y="138" width="100" height="18" rx="3" fill="#FEE8E8" stroke="#CC3333" stroke-width="0.8"/>
  <text x="160" y="150" text-anchor="middle" font-size="9" fill="#CC3333" font-weight="600">0" overhang</text>

  <!-- Outcome -->
  <rect x="90" y="90" width="140" height="26" rx="4" fill="#FEE8E8" stroke="#CC3333" stroke-width="1"/>
  <text x="160" y="107" text-anchor="middle" font-size="10" fill="#CC2222" font-weight="700">Plume escapes both sides</text>

  <!-- ===== CENTER PANEL: Minimum Geometry ===== -->
  <text x="480" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#CC8800">Minimum Geometry (W_min = d_capture)</text>

  <!-- Cooking surface — 24" -->
  <rect x="440" y="400" width="80" height="10" rx="2" fill="#444" stroke="#333" stroke-width="1"/>
  <text x="480" y="425" text-anchor="middle" font-size="8" fill="#666">Cooking Surface (24")</text>

  <!-- Plume rising — same expansion to 41" -->
  <path d="M450,400 Q445,370 438,340 Q428,300 418,260 Q411,230 411,210 L549,210 Q549,230 542,260 Q532,300 522,340 Q515,370 510,400 Z" fill="url(#plumeGrad)"/>

  <!-- Hood canopy — 42" = 140px, OH_min 9" per side (30px) -->
  <path d="M404,170 L410,195 L550,195 L556,170 Z" fill="#555" stroke="#444" stroke-width="2"/>
  <rect x="465" y="140" width="30" height="30" fill="#555" stroke="#444" stroke-width="1.5"/>

  <!-- Edge-to-edge note: hood just spans the plume, no margin -->
  <text x="399" y="228" text-anchor="end" font-size="7" fill="#CC8800">No wind</text>
  <text x="399" y="238" text-anchor="end" font-size="7" fill="#CC8800">margin</text>
  <text x="561" y="228" text-anchor="start" font-size="7" fill="#CC8800">No wind</text>
  <text x="561" y="238" text-anchor="start" font-size="7" fill="#CC8800">margin</text>

  <!-- Mounting height dimension -->
  <line x1="375" y1="185" x2="375" y2="400" stroke="#888" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="370" y1="185" x2="380" y2="185" stroke="#888" stroke-width="0.8"/>
  <line x1="370" y1="400" x2="380" y2="400" stroke="#888" stroke-width="0.8"/>
  <text x="372" y="297" text-anchor="middle" font-size="7" fill="#888" transform="rotate(-90,372,297)">30"</text>

  <!-- Hood width dimension -->
  <line x1="410" y1="435" x2="550" y2="435" stroke="#888" stroke-width="0.8" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="480" y="448" text-anchor="middle" font-size="8" fill="#888">42" hood (W_min = d_capture 41")</text>

  <!-- Overhang arrows and labels -->
  <line x1="410" y1="458" x2="440" y2="458" stroke="#CC8800" stroke-width="0.8" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="425" y="468" text-anchor="middle" font-size="7" fill="#CC8800">9"</text>
  <line x1="520" y1="458" x2="550" y2="458" stroke="#CC8800" stroke-width="0.8" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="535" y="468" text-anchor="middle" font-size="7" fill="#CC8800">9"</text>

  <!-- Overhang label -->
  <rect x="415" y="138" width="130" height="18" rx="3" fill="#FFF3E0" stroke="#CC8800" stroke-width="0.8"/>
  <text x="480" y="150" text-anchor="middle" font-size="9" fill="#CC8800" font-weight="600">9" overhang (OH_min)</text>

  <!-- Outcome -->
  <rect x="405" y="90" width="150" height="26" rx="4" fill="#FFF3E0" stroke="#CC8800" stroke-width="1"/>
  <text x="480" y="107" text-anchor="middle" font-size="10" fill="#AA6600" font-weight="700">98% capture — still air only</text>

  <!-- ===== RIGHT PANEL: Recommended Outdoor ===== -->
  <text x="800" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#227722">Recommended Outdoor (K = 1.70)</text>

  <!-- Cooking surface — 24" -->
  <rect x="760" y="400" width="80" height="10" rx="2" fill="#444" stroke="#333" stroke-width="1"/>
  <text x="800" y="425" text-anchor="middle" font-size="8" fill="#666">Cooking Surface (24")</text>

  <!-- Plume rising — same expansion to 41" -->
  <path d="M770,400 Q765,370 758,340 Q748,300 738,260 Q731,230 731,210 L869,210 Q869,230 862,260 Q852,300 842,340 Q835,370 830,400 Z" fill="url(#plumeGrad)"/>

  <!-- Hood canopy — 57" = 190px (RB-002 Table 3.7), OH_rec 17" per side -->
  <path d="M698,170 L705,195 L895,195 L902,170 Z" fill="#555" stroke="#444" stroke-width="2"/>
  <rect x="785" y="140" width="30" height="30" fill="#555" stroke="#444" stroke-width="1.5"/>

  <!-- Green capture envelope — plume fully contained with margin -->
  <rect x="705" y="195" width="190" height="85" rx="2" fill="url(#captureGreen)" opacity="0.35"/>

  <!-- Capture envelope label -->
  <text x="710" y="265" font-size="7" fill="#227722" font-weight="500">Capture</text>
  <text x="710" y="275" font-size="7" fill="#227722" font-weight="500">Envelope</text>

  <!-- Mounting height dimension -->
  <line x1="670" y1="185" x2="670" y2="400" stroke="#888" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="665" y1="185" x2="675" y2="185" stroke="#888" stroke-width="0.8"/>
  <line x1="665" y1="400" x2="675" y2="400" stroke="#888" stroke-width="0.8"/>
  <text x="667" y="297" text-anchor="middle" font-size="7" fill="#888" transform="rotate(-90,667,297)">30"</text>

  <!-- Hood width dimension -->
  <line x1="705" y1="435" x2="895" y2="435" stroke="#888" stroke-width="0.8" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="800" y="448" text-anchor="middle" font-size="8" fill="#888">57" hood (W_rec, RB-002 Table 3.7)</text>

  <!-- Overhang arrows -->
  <line x1="705" y1="458" x2="760" y2="458" stroke="#227722" stroke-width="0.8" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="732" y="468" text-anchor="middle" font-size="7" fill="#227722">17"</text>
  <line x1="840" y1="458" x2="895" y2="458" stroke="#227722" stroke-width="0.8" marker-start="url(#dimArrowRev)" marker-end="url(#dimArrow)"/>
  <text x="868" y="468" text-anchor="middle" font-size="7" fill="#227722">17"</text>

  <!-- Overhang label -->
  <rect x="735" y="138" width="130" height="18" rx="3" fill="#E8F8E8" stroke="#44AA44" stroke-width="0.8"/>
  <text x="800" y="150" text-anchor="middle" font-size="9" fill="#227722" font-weight="600">17" overhang (OH_rec)</text>

  <!-- Outcome -->
  <rect x="715" y="90" width="170" height="26" rx="4" fill="#E8F8E8" stroke="#44AA44" stroke-width="1"/>
  <text x="800" y="107" text-anchor="middle" font-size="10" fill="#227722" font-weight="700">Turbulence + light-wind margin</text>

  <!-- ===== BOTTOM COMPARISON BAR ===== -->
  <rect x="30" y="478" width="900" height="29" rx="5" fill="#F5F5F5" stroke="#DDD" stroke-width="1"/>
  <text x="480" y="496" text-anchor="middle" font-size="9" fill="#555">
    W_min = d_capture: 98% time-averaged capture, still air, no wind/turbulence margin (RB-005 §3.1, Table 3.1a) | W_rec: K = 1.70 outdoor margin (RB-002 Table 3.7; RB-005 Table 3.1b)
  </text>

  <!-- Source attribution -->
  <text x="480" y="515" text-anchor="middle" font-size="7" fill="#AAA">OVS-RB-002 / OVS-RB-005 | outdoorventilationstandard.com</text>
</svg>