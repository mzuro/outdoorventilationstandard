<svg role="img" aria-labelledby="hgc-title" aria-describedby="hgc-desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title id="hgc-title">Hood overhang comparison for a Gas Grill Medium at 30 inches: no overhang, minimum width W_min = d_capture, recommended width W_rec</title>
  <desc id="hgc-desc">Three side-by-side front-view diagrams drawn to one scale (4.5 pixels per inch) of a 24 inch cooking surface under a hood mounted 30 inches above it, with the same plume in each: the time-averaged capture diameter d_capture = 0.48 (z − z0) + D_eff = 41 inches at the hood plane and the intermittent envelope d_99_instant = 0.72 (z − z0) + D_eff = 52 inches (RB-002 Table 3.3a). Left, a 24 inch hood with no overhang: both envelopes overflow on both sides and the OVS model gives 0% capture. Centre, a 41 inch hood (W_min = d_capture, overhang 8.5 inches per side): the 41 inch time-averaged plume just fits but the 52 inch intermittent envelope overflows by 5.6 inches per side; the OVS model gives 71% capture in still air and 34% in a 5 mph side wind. Right, the recommended 57 inch hood (W_rec = 1.38 × d_capture, overhang 16.5 inches per side, 0.42 m, which RB-002 Table 3.6b prints as 17 inches): the intermittent envelope fits with 2.4 inches to spare and the OVS model gives 96% in still air and 72% at 5 mph. Capture percentages are the OVS model criterion (RB-006 §3.4 aperture ±OH about the centerline, Gaussian σ = 1.5 b_T), not paper-printed values: RB-008 Table 3.10 prints 65 to 75% for a 42 inch hood and over 95% for 57 inches in still air; RB-006 Table 3.10 prints 70 to 75% for 57 inches at 5 mph.</desc>
