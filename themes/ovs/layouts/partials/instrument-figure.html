{{- /*
  instrument-figure.html — shared instrument mount markup (Task 12).

  Emits exactly the shortcode contract from the Task 12 brief:

    <figure class="ovs-instrument" data-instrument="ID" data-preset="PRESET">
      <noscript>...legacy SVG or one-line text fallback...</noscript>
    </figure>
    <script type="module">
      import { mount } from '/js/ovs/instruments/ID.mjs';
      document.querySelectorAll('[data-instrument="ID"]').forEach(mount);
    </script>

  Called with a dict: "id" (required, e.g. "i03"), "preset" (optional),
  "caption" (optional, pre-escaped HTML string rendered as <figcaption> —
  additive to the brief's contract, not part of it), "fallback" (optional
  static/diagrams/*.svg basename that overrides the id -> legacy-SVG map
  below — needed because i10 is one module shared by two pages whose
  correct no-JS diagrams differ; pages set `fallback_svg` front matter,
  plumbed through by tools/single.html and questions/single.html).

  This is the single source of truth for the markup shape so the
  "instrument" shortcode, tools/single.html and questions/single.html
  auto-embeds, and the homepage hero Figure 1 all render identically.

  "Explain this configuration" (AI #7, v1: i01/i02 only) is appended here
  rather than per-page, so it appears automatically wherever i01/i02 is
  embedded (homepage hero, their tool pages, and any question page that
  embeds them). static/js/ovs/instruments/i01.mjs and i02.mjs expose the
  live control state as `figureEl.ovsInstrument` (a createInstrument()
  handle); static/js/ovs/explain-ui.mjs reads it on click and POSTs
  {instrument, params} to /api/explain — no free text, so the button
  carries none of the ask box's prompt-injection surface.

  id -> legacy SVG map (static/diagrams/*.svg) per the brief; i01 and i02
  have no legacy diagram and get a one-line text fallback instead.

  The instrument modules themselves (static/js/ovs/instruments/i01.mjs..
  i10.mjs) are Tasks 14-16 and do not exist yet — every page using this
  partial will 404 the <script type="module"> import until then. That is
  expected and intentionally not worked around here.
*/ -}}
{{- $id := .id }}
{{- $preset := .preset | default "" }}
{{- $caption := .caption }}
{{- $fallback := .fallback }}
{{- $svgMap := dict
  "i03" "wind-deflection-trajectory"
  "i04" "plume-width-by-height"
  "i05" "hood-geometry-comparison"
  "i06" "velocity-decay-curves"
  "i07" "side-panel-effectiveness"
  "i08" "indoor-vs-outdoor-comparison"
  "i09" "heat-release-rate-comparison"
  "i10" "failure-mode-taxonomy"
}}
<figure class="ovs-instrument" data-instrument="{{ $id }}" data-preset="{{ $preset }}">
  <noscript>{{- with $fallback | default (index $svgMap $id) }}{{ readFile (printf "static/diagrams/%s.svg" .) | safeHTML }}{{- else }}<p>Instrument I-{{ upper (strings.TrimPrefix "i" $id) }} requires JavaScript to render. <a href="/tools/">Browse all instruments</a>.</p>{{- end }}</noscript>
  {{- with $caption }}
  <figcaption>{{ . | safeHTML }}</figcaption>
  {{- end }}
</figure>
{{- if or (eq $id "i01") (eq $id "i02") }}
<div class="ovs-explain" data-explain-for="{{ $id }}">
  <button type="button" class="ovs-explain-btn">Explain this configuration</button>
  <input type="text" name="website" class="ovs-explain-honey" autocomplete="off" tabindex="-1" aria-hidden="true">
  <div class="ovs-explain-turnstile cf-turnstile" data-sitekey="0x4AAAAAACcaq_joFScewE6d" data-size="invisible"></div>
  <div class="ovs-explain-result" hidden></div>
</div>
{{- end }}
<script type="module">
  import { mount } from '/js/ovs/instruments/{{ $id }}.mjs';
  document.querySelectorAll('[data-instrument="{{ $id }}"]').forEach(mount);
  {{- if or (eq $id "i01") (eq $id "i02") }}
  import('/js/ovs/explain-ui.mjs').then(function(m) { m.wireExplain('{{ $id }}'); });
  {{- end }}
</script>
